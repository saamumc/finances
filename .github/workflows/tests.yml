name: tests

on:
  push:
    branches:
      - main
      - cleanup-stability-2026-09
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run domain tests
        run: python -m pytest -q tests/test_domain.py tests/test_invariants.py
